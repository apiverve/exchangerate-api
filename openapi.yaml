openapi: 3.0.4
info:
  title: Exchange Rate
  description: >-
    Exchange Rate looks up the conversion rate between two currency codes. It
    returns the current forex rate and last-updated timestamp across 170+
    supported currencies, in USD or any other base; paid plans add the inverse
    rate.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/exchangerate:
    get:
      summary: Exchange Rate
      description: >-
        Exchange Rate is a simple tool for getting the current exchange rate
        between two currencies. It returns the current exchange rate.
      operationId: exchangerate
      parameters:
        - name: currency1
          in: query
          schema:
            type: string
          required: true
          description: The first currency you want to get the exchange rate for
          example: USD
        - name: currency2
          in: query
          schema:
            type: string
          required: true
          description: The second currency you want to get the exchange rate for
          example: EUR
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional past date (YYYY-MM-DD) to use that day's closing rates
            instead of live rates. History runs from 1999-01-04 for about 30
            major currencies and covers every supported currency from March
            2024. A day with no rates, such as a weekend or holiday, uses the
            last close before it.
          example: '2025-06-02'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  currency1: USD
                  currency2: EUR
                  exchangeRate: '0.866664'
                  inverseRate: '1.153850'
                  lastUpdated: '2026-09-16T02:00:27.378Z'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
