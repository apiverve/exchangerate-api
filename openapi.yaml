openapi: 3.0.4
info:
  title: Exchange Rate
  description: >-
    Exchange Rate looks up the conversion rate between two currency codes across
    170+ currencies, with both currency names and the last-updated time. Paid
    plans add the inverse rate, the pair's 1-day to 1-year change, its 30-day
    high, low, average and volatility, past dates, and hourly and 30-day daily
    history.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/exchangerate:
    get:
      summary: Exchange Rate
      description: >-
        Get the current exchange rate between two currencies, with the pair's
        recent changes and 30-day range on paid plans.
      operationId: exchangerate
      parameters:
        - name: currency1
          in: query
          schema:
            type: string
          required: true
          description: The first currency you want to get the exchange rate for
          example: USD
        - name: currency2
          in: query
          schema:
            type: string
          required: true
          description: The second currency you want to get the exchange rate for
          example: EUR
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional past date (YYYY-MM-DD) to use that day's closing rates
            instead of live rates. History runs from 1999-01-04 for about 30
            major currencies and covers every supported currency from March
            2024. A day with no rates, such as a weekend or holiday, uses the
            last close before it.
          example: '2025-06-02'
        - name: history
          in: query
          schema:
            type: boolean
          required: false
          description: Include the pair's daily closing rate for the last 30 days
          example: true
        - name: hourly
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include the pair's rate for each of the last 24 hours (live rates
            only, not with date)
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  currency1: USD
                  currency2: EUR
                  exchangeRate: '0.895099'
                  inverseRate: '1.117195'
                  date: '2026-10-27'
                  lastUpdated: '2026-10-27T17:41:09.810Z'
                  currency1Name: US Dollar
                  currency2Name: Euro
                  change1d: 0.4467
